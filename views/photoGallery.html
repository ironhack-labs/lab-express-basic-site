<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <header>
    <ul class="navbar">
      <li><a id="home" href="/">HOME</a></li>
      <li><a id="about" href="/about">ABOUT</a></li>
      <li><img src="/images/kobe-signature.svg" alt="Kobe signature"></li>
      <li><a id="awards" href="/works">AWARDS</a></li>
      <li><a id="photos" href="/photoGallery" style="border: 2px solid #906e25;">PHOTOS</a></li>
    </ul>
  </header>
  <main class="gallery">
    <div class="card-container">
      <img src="/images/kobe-animation.jpg">
      <div class="desc">Kobe Short Film winner of Academy Award</div>
    </div>
    <div class="card-container">
      <img src="/images/kobe-messi-comercial.jpg">
      <div class="desc">Kobe finming a commercial with Messi</div>
    </div>
    <div class="card-container">
      <img src="/images/kobe-michael.jpg">
      <div class="desc">Kobe talking with Michael Jordan in NBA Finals</div>
    </div>
    <div class="card-container">
      <img src="/images/kobe-mvp.jpg">
      <div class="desc">Kobe winning the NBA MVP Award</div>
    </div>
    <div class="card-container">
      <img src="/images/kobe-rookie-playoffs.jpg">
      <div class="desc">Kobe with his Jersey as a rookie</div>
    </div>
    <div class="card-container">
      <img src="/images/kobe-usa.jpg">
      <div class="desc">Kobe playing for the USA team</div>
    </div>
  </main>
</body>
</html>
