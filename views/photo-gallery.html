<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" aria-current="about" href="/about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" aria-current="works" href="/works">Works</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" aria-current="photo-gallery" href="/photo-gallery">Photo Gallery</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
    <h1 class="text-warning">Photo Gallery</h1>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-9">
                <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="false">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                        <img src="https://ep01.epimg.net/elcomidista/imagenes/2017/02/22/articulo/1487804099_363696_1487804800_sumario_normal.jpg" class="d-block w-100" alt="patatas">
                        <div class="carousel-caption d-none d-md-block text-dark">
                            <h5>Patatas</h5>
                            <p>Bien ricas en su punto de sal</p>
                        </div>
                        </div>
                        <div class="carousel-item">
                        <img src="https://soycomocomo.es/media/2019/03/zanahorias.jpg" class="d-block w-100" alt="zanahorias">
                        <div class="carousel-caption d-none d-md-block text-dark">
                            <h5>Zanahorias</h5>
                            <p>Nutritivas a la par que saludables</p>
                        </div>
                        </div>
                        <div class="carousel-item">
                        <img src="https://static4.depositphotos.com/1017505/320/i/450/depositphotos_3201839-stock-photo-three-tomatoes.jpg" class="d-block w-100" alt="tomates">
                        <div class="carousel-caption d-none d-md-block text-dark">
                            <h5>Tomates</h5>
                            <p>Manjar de los dioses hecho fruta</p>
                        </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy" crossorigin="anonymous"></script>
</body>
</html>
