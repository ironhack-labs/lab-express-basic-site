            <h2>Gustavo da Hungria Neves </h2>
            <h2> 30 anos </h2>
           </div>
               
            <p class="bio">Gustavo da Hungria Neves nasceu em Ceilândia, 26 de maio de 1991, mais conhecido como Hungria Hip-Hop é um cantor, compositor e rapper brasileiro, dono dos hits “Lembranças”, “Beijo com trap” e “Coração de aço”.</p>
